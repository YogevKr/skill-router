[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-router"
version = "0.4.6"
description = "Local, scoped routing for agent skills"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Yogev" }]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7,<0.8"]

[project.scripts]
skill-router = "skill_router.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
